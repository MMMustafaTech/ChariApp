spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.max-lifetime=300000

app.cors.allowed-origins=${APP_ALLOWED_ORIGINS}
app.cors.allowed-origin-patterns=${APP_ALLOWED_ORIGIN_PATTERNS:}
app.security.lookup-key-base64=${APP_LOOKUP_KEY_BASE64}
app.security.encryption-key-base64=${APP_ENCRYPTION_KEY_BASE64}

app.jwt.issuer=${APP_JWT_ISSUER}
app.jwt.signing-key-base64=${APP_JWT_SIGNING_KEY_BASE64}
app.jwt.access-token-lifetime=${APP_JWT_ACCESS_TOKEN_LIFETIME:PT15M}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Safe and idempotent: normalized imported records are copied into the protected runtime model.
# Keep the defaults enabled until the imported tables are retired in a later migration.
app.citizens.backfill.enabled=${APP_CITIZENS_BACKFILL_ENABLED:true}
app.documents.backfill.enabled=${APP_DOCUMENTS_BACKFILL_ENABLED:true}
