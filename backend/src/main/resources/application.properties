spring.application.name=chari-app
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}
server.forward-headers-strategy=native

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

app.security.rate-limit.window=PT5M
app.security.rate-limit.login.max-requests=5
app.security.rate-limit.otp-request.max-requests=3
app.security.rate-limit.otp-verification.max-requests=10
app.security.rate-limit.refresh.max-requests=10

# Disabled by default. Set APP_TEST_DATA_ENROLLMENT_CITIZEN_ENABLED=true only
# while testing the hosted enrollment flow; it creates a registry citizen, not an account.
app.test-data.enrollment-citizen.enabled=false

# One-time hosted administrator bootstrap. Enable only for the first deployment,
# set the email/password through secrets, then disable it after successful login.
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.first-name=${APP_BOOTSTRAP_ADMIN_FIRST_NAME:Administrator}
app.bootstrap-admin.last-name=${APP_BOOTSTRAP_ADMIN_LAST_NAME:}

app.attachments.local.root=${APP_ATTACHMENTS_LOCAL_ROOT:./var/attachments}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
